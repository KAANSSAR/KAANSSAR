name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate green snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: KAANSSAR
          outputs: |
            dist/green-snake.svg?color_snake=%235FD068&color_dots=%230E4429,%23006D32,%2326A641,%2339D353,%235FD068

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}